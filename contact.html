<!-- Mark Britt — comic book art site -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Mark Britt Comics</title>
    <meta property="og:title" content="Contact — Mark Britt Comics">
    <meta property="og:description" content="Get in touch with Mark Britt.">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="site-images/SVG/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;900&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --yellow: #ffc301;
            --red: #ff2a63;
        }

        body { font-family: 'Roboto Mono', monospace; }

        header {
            position: sticky;
            top: 0;
            z-index: 60;
            background: #f0f0f0;
            border-bottom: 1px solid #000;
            width: 100%;
            padding: 20px 40px;
            box-sizing: border-box;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand .tagline {
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            font-weight: 300;
        }

        .brand .tagline strong { font-weight: 700; }

        .nav-right a {
            font-family: 'Roboto', sans-serif;
            font-weight: 300;
            font-size: 15px;
            text-decoration: none;
            color: #000;
        }

        .nav-right a:hover { text-decoration: underline; }

        .menu-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            font-weight: 300;
            font-size: 15px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #000;
            cursor: pointer;
        }

        .menu-toggle .menu-caret {
            color: #000;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .menu-toggle[aria-expanded="true"] .menu-caret {
            color: var(--red);
            transform: rotate(180deg);
        }

        .menu-panel {
            position: absolute;
            top: 100%;
            right: 40px;
            width: 320px;
            box-sizing: border-box;
            background: #f0f0f0;
            border: 1px solid #000;
            border-top: none;
            padding: 36px 32px;
            display: none;
            flex-direction: column;
            z-index: 59;
        }

        .menu-panel.open { display: flex; }

        .menu-panel a {
            font-family: 'Roboto', sans-serif;
            font-weight: 300;
            font-size: 20px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #000;
            text-decoration: none;
            text-align: right;
            padding: 16px 0;
        }

        .menu-panel a:hover { text-decoration: underline; }

        /* ── Contact form ── */
        .form-box { max-width: 520px; }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-field { flex: 1; }

        .form-field { margin-bottom: 22px; }

        .form-field:last-of-type { margin-bottom: 28px; }

        .form-field label {
            display: block;
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-field input,
        .form-field textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #000;
            background: #f0f0f0;
            padding: 12px 14px;
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            color: #000;
        }

        .form-field input:focus,
        .form-field textarea:focus {
            outline: 2px solid var(--yellow);
            outline-offset: -1px;
        }

        .form-field textarea {
            resize: vertical;
            min-height: 140px;
        }

        .form-submit {
            display: inline-block;
            background: #000;
            color: var(--yellow);
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 14px 28px;
            border: none;
            cursor: pointer;
        }

        .form-submit:hover { background: var(--red); color: #fff; }

        .form-submit:disabled { opacity: 0.6; cursor: default; }

        .form-status {
            display: none;
            margin-top: 18px;
            padding: 14px 16px;
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            border: 1px solid #000;
        }

        .form-status.visible { display: block; }

        .form-status.success { background: var(--yellow); }

        .form-status.error { background: var(--red); color: #fff; border-color: var(--red); }

        @media (max-width: 768px) {
            .frame { padding: 0 20px; }

            header {
                flex-wrap: nowrap;
                gap: 14px;
                justify-content: space-between;
                align-items: center;
                padding: 14px 20px;
            }
            .brand .tagline { display: none; }

            .menu-panel { right: 20px; width: auto; left: 20px; padding: 28px 24px; }
            .menu-panel a { font-size: 18px; padding: 14px 0; }

            .form-row { flex-direction: column; gap: 0; }

            footer { padding: 16px 20px 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <a href="index.html" class="logo-link" aria-label="Home">
                <div class="logo">
                    <img src="site-images/SVG/logo.svg" alt="Mark Britt">
                </div>
            </a>
            <span class="tagline"><strong>Mark Britt</strong> writes comic books.</span>
        </div>
        <div class="nav-right">
            <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="menuPanel">
                MENU
                <svg class="menu-caret" width="14" height="9" viewBox="0 0 14 9" fill="none" aria-hidden="true">
                    <path d="M1 1L7 7L13 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        <nav class="menu-panel" id="menuPanel">
            <a href="contact.html">CONTACT</a>
            <a href="foreditors.html">FOR EDITORS</a>
            <a href="mailing-list.html">MAILING LIST</a>
            <a href="index.html">HOME</a>
        </nav>
    </header>

    <div class="frame">

        <!-- Title -->
        <section class="preview-hero">
            <h1 class="slide-in">CONTACT</h1>
        </section>

        <span class="preview-tag">Get In Touch</span>

        <!-- Contact form -->
        <div class="preview-box form-box">
            <div class="color-bar"></div>
            <h2>Send a Message</h2>
            <form class="site-form" action="https://formspree.io/f/mvkolqbk" method="POST">
                <input type="hidden" name="_subject" value="New message from markmakescomics.com contact form">
                <input type="text" name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
                <div class="form-row">
                    <div class="form-field">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="first_name" autocomplete="given-name" required>
                    </div>
                    <div class="form-field">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="last_name" autocomplete="family-name" required>
                    </div>
                </div>
                <div class="form-field">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="form-field">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                <button type="submit" class="form-submit">Send Message</button>
            </form>
            <div class="form-status" id="formStatus"></div>
        </div>

        <!-- Back to home -->
        <nav class="preview-nav">
            <a href="index.html">&larr; Back to Home</a>
        </nav>

    </div><!-- end .frame -->

    <!-- Footer -->
    <footer>
        <div class="footer-row">
            <p>
                Based in the SF Bay Area.<br>
                <a href="https://linkedin.com/in/markhavenbritt" target="_blank">On LinkedIn</a><br>
                <a href="mailto:markhavenbritt@gmail.com">markhavenbritt@gmail.com</a>
            </p>
            <nav class="footer-links">
                <a href="mailto:markhavenbritt@gmail.com">Contact</a>
            </nav>
        </div>
        <div class="base-bar"></div>
    </footer>

    <script>
        (function () {
            const btn = document.getElementById('menuToggle');
            const panel = document.getElementById('menuPanel');
            if (!btn || !panel) return;
            function closeMenu() { btn.setAttribute('aria-expanded', 'false'); panel.classList.remove('open'); }
            function openMenu() { btn.setAttribute('aria-expanded', 'true'); panel.classList.add('open'); }
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                (btn.getAttribute('aria-expanded') === 'true') ? closeMenu() : openMenu();
            });
            document.addEventListener('click', function (e) {
                if (!panel.contains(e.target) && e.target !== btn) closeMenu();
            });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
        })();
    </script>
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.slide-in').forEach(function (el) {
                requestAnimationFrame(function () { el.classList.add('visible'); });
            });
        });
    </script>
    <script>
        (function () {
            var form = document.querySelector('.site-form');
            var status = document.getElementById('formStatus');
            if (!form || !status) return;
            var submitBtn = form.querySelector('.form-submit');

            function showStatus(kind, message) {
                status.textContent = message;
                status.className = 'form-status visible ' + kind;
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.textContent = 'Sending...';

                fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                }).then(function (response) {
                    if (response.ok) {
                        form.reset();
                        showStatus('success', "Thanks \u2014 your message is on its way.");
                        return;
                    }
                    return response.json().then(function (data) {
                        var msg = (data && data.errors && data.errors.length)
                            ? data.errors.map(function (err) { return err.message; }).join(', ')
                            : 'Something went wrong. Please try again or email markhavenbritt@gmail.com directly.';
                        showStatus('error', msg);
                    });
                }).catch(function () {
                    showStatus('error', 'Something went wrong. Please try again or email markhavenbritt@gmail.com directly.');
                }).finally(function () {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Message';
                });
            });
        })();
    </script>

</body>
</html>
