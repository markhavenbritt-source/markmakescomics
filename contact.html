    <style>
        :root {
            --yellow: #ffc301;
            --red: #ff2a63;
        }

        body { font-family: 'Roboto Mono', monospace; }

        header {
            position: sticky;
            top: 0;
            z-index: 60;
            background: #f0f0f0;
            border-bottom: 1px solid #000;
            width: 100%;
            padding: 20px 40px;
            box-sizing: border-box;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand .tagline {
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            font-weight: 300;
        }

        .brand .tagline strong { font-weight: 700; }

        .brand .tagline .typed { font-weight: 300; }

        /* Reserve the width of the longest phrase so the header doesn't shift
           while the text types/erases. */
        .brand .tagline .typed-wrap {
            position: relative;
            display: inline-block;
        }

        .brand .tagline .typed-sizer {
            visibility: hidden;
            white-space: nowrap;
        }

        .brand .tagline .typed-live {
            position: absolute;
            left: 0;
            top: 0;
            white-space: nowrap;
        }

        .brand .tagline .typed strong { font-weight: 700; }

        .brand .tagline .type-cursor {
            display: inline-block;
            width: 1px;
            height: 1em;
            margin-left: 1px;
            background: #000;
            vertical-align: text-bottom;
            animation: type-blink 1s step-end infinite;
        }

        @keyframes type-blink {
            0%, 100% { opacity: 1; }
            50%      { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            .brand .tagline .type-cursor { animation: none; }
        }

        .nav-right a {
            font-family: 'Roboto', sans-serif;
            font-weight: 300;
            font-size: 15px;
            text-decoration: none;
            color: #000;
        }

        .nav-right a:hover { text-decoration: underline; }

        .menu-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            font-weight: 300;
            font-size: 15px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: #000;
            cursor: pointer;
        }

        .menu-toggle .menu-caret {
            color: #000;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .menu-toggle[aria-expanded="true"] .menu-caret {
            color: var(--red);
            transform: rotate(180deg);
        }

        .menu-panel {
            position: absolute;
            top: 100%;
            right: 40px;
            width: 320px;
            box-sizing: border-box;
            background: #f0f0f0;
            border: 1px solid #000;
            border-top: none;
            padding: 36px 32px;
            display: none;
            flex-direction: column;
            z-index: 59;
        }

        .menu-panel.open { display: flex; }

        .menu-panel a {
            font-family: 'Roboto', sans-serif;
            font-weight: 300;
            font-size: 20px;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #000;
            text-decoration: none;
            text-align: right;
            padding: 16px 0;
        }

        .menu-panel a:hover { text-decoration: underline; }

        /* ── Contact form ── */
        .form-box { max-width: 520px; }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-field { flex: 1; }

        .form-field { margin-bottom: 22px; }

        .form-field:last-of-type { margin-bottom: 28px; }

        .form-field label {
            display: block;
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .form-field input,
        .form-field textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #000;
            background: #f0f0f0;
            padding: 12px 14px;
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            color: #000;
        }

        .form-field input:focus,
        .form-field textarea:focus {
            outline: 2px solid var(--yellow);
            outline-offset: -1px;
        }

        .form-field textarea {
            resize: vertical;
            min-height: 140px;
        }

        .form-submit {
            display: inline-block;
            background: #000;
            color: var(--yellow);
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 14px 28px;
            border: none;
            cursor: pointer;
        }

        .form-submit:hover { background: var(--red); color: #fff; }

        .form-submit:disabled { opacity: 0.6; cursor: default; }

        .form-status {
            display: none;
            margin-top: 18px;
            padding: 14px 16px;
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            border: 1px solid #000;
        }

        .form-status.visible { display: block; }

        .form-status.success { background: var(--yellow); }

        .form-status.error { background: var(--red); color: #fff; border-color: var(--red); }

        @media (max-width: 768px) {
            .frame { padding: 0 20px; }

            header {
                flex-wrap: nowrap;
                gap: 14px;
                justify-content: space-between;
                align-items: center;
                padding: 14px 20px;
            }
            .brand .tagline { display: none; }

            .menu-panel { right: 20px; width: auto; left: 20px; padding: 28px 24px; }
            .menu-panel a { font-size: 18px; padding: 14px 0; }

            .form-row { flex-direction: column; gap: 0; }

            footer { padding: 16px 20px 0; }
        }
        /* Mailing list — header module */
        .header-signup {
            display: flex;
            align-items: center;
        }

        .header-signup__controls {
            display: flex;

        .header-signup__field {

            font-size: 12px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            text-align: center;

        }

        .header-signup__field::placeholder { color: #000; opacity: 1; }

        .header-signup__field:focus {

        .header-signup__submit {

            white-space: nowrap;
        }

        .header-signup__submit:hover { text-decoration: underline; }

        .header-signup__submit:disabled { opacity: 0.6; cursor: default; }

        .header-signup__status {

        }

        .header-signup__status.visible { display: inline-block; }

        @media (max-width: 1024px) {
            .header-signup { display: none; }
        }

    <script>
        (function () {
            const btn = document.getElementById('menuToggle');
            const panel = document.getElementById('menuPanel');
            if (!btn || !panel) return;
            function closeMenu() { btn.setAttribute('aria-expanded', 'false'); panel.classList.remove('open'); }
            function openMenu() { btn.setAttribute('aria-expanded', 'true'); panel.classList.add('open'); }
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                (btn.getAttribute('aria-expanded') === 'true') ? closeMenu() : openMenu();
            });
            document.addEventListener('click', function (e) {
                if (!panel.contains(e.target) && e.target !== btn) closeMenu();
            });
            document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });
        })();
    </script>
    <script>
        window.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.slide-in').forEach(function (el) {
                requestAnimationFrame(function () { el.classList.add('visible'); });
            });
        });
    </script>
    <script>
        (function () {
            var form = document.querySelector('.site-form');
            var status = document.getElementById('formStatus');
            if (!form || !status) return;
            var submitBtn = form.querySelector('.form-submit');

            function showStatus(kind, message) {
                status.textContent = message;
                status.className = 'form-status visible ' + kind;
            }

            form.addEventListener('submit', function (e) {
                e.preventDefault();
                submitBtn.disabled = true;
                submitBtn.textContent = 'Sending...';

                fetch(form.action, {
                    method: 'POST',
                    body: new FormData(form),
                    headers: { 'Accept': 'application/json' }
                }).then(function (response) {
                    if (response.ok) {
                        form.reset();
                        showStatus('success', "Thanks \u2014 your message is on its way.");
                        return;
                    }
                    return response.json().then(function (data) {
                        var msg = (data && data.errors && data.errors.length)
                            ? data.errors.map(function (err) { return err.message; }).join(', ')
                            : 'Something went wrong. Please try again or email markhavenbritt@gmail.com directly.';
                        showStatus('error', msg);
                    });
                }).catch(function () {
                    showStatus('error', 'Something went wrong. Please try again or email markhavenbritt@gmail.com directly.');
                }).finally(function () {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Message';
                });
            });
        })();
    </script>

    <!-- Tagline typewriter: cycle full "Mark Britt is..." sentences -->
    <script>
        (function () {
            const el = document.getElementById('typedRole');
            if (!el) return;

            const phrases = [
                'writes comic books.',
                "thinks you're doing great.",
                'draws rad comics.',
                'makes narrative art.',
                'is gonna win the whole damn thing.',
                'likes Larry Stroman art.',
                'is a sober single dad.',
                'was raised Irish Catholic but is now mostly witch.'
            ];

            const TYPE_SPEED   = 55;
            const ERASE_SPEED  = 30;
            const HOLD_FULL    = 1900;
            const HOLD_EMPTY   = 350;

            let p = 0, c = 0, erasing = false;

            function tick() {
                const phrase = phrases[p];
                if (!erasing) {
                    c++;
                    el.textContent = phrase.slice(0, c);
                    if (c === phrase.length) { erasing = true; return setTimeout(tick, HOLD_FULL); }
                    return setTimeout(tick, TYPE_SPEED);
                } else {
                    c--;
                    el.textContent = phrase.slice(0, c);
                    if (c === 0) { erasing = false; p = (p + 1) % phrases.length; return setTimeout(tick, HOLD_EMPTY); }
                    return setTimeout(tick, ERASE_SPEED);
                }
            }
            tick();
        })();
    </script>

    <!-- Header mailing list module: fake-submit, show a persistent signed-up indicator -->
    <script>
        (function () {
            var form = document.getElementById('mailingListForm');
            var status = document.getElementById('mailingListStatus');
            if (!form || !status) return;
            var controls = form.querySelector('.header-signup__controls');
            var submitBtn = form.querySelector('.header-signup__submit');

            form.addEventListener('submit', function () {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Joining...';

                setTimeout(function () {
                    controls.style.display = 'none';
                    status.className = 'header-signup__status visible';
                }, 600);
            });
        })();
    </script>
